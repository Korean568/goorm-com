<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>구름닷컴</title>
<meta name="description" content="우리 반 친구들이 공지·과제·자유·질문 글을 나누는 학급 게시판">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 80'%3E%3Cg fill='%232f62d8'%3E%3Ccircle cx='38' cy='46' r='24'/%3E%3Ccircle cx='66' cy='32' r='30'/%3E%3Ccircle cx='94' cy='50' r='20'/%3E%3Crect x='14' y='46' width='100' height='28' rx='14'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="gate" id="gate" hidden aria-labelledby="gateTitle">
  <svg class="puff g1" viewBox="0 0 120 56" aria-hidden="true"><circle cx="34" cy="34" r="20"/><circle cx="62" cy="24" r="24"/><circle cx="90" cy="36" r="18"/><rect x="14" y="34" width="94" height="22" rx="11"/></svg>
  <svg class="puff g2" viewBox="0 0 120 56" aria-hidden="true"><circle cx="34" cy="34" r="20"/><circle cx="62" cy="24" r="24"/><circle cx="90" cy="36" r="18"/><rect x="14" y="34" width="94" height="22" rx="11"/></svg>
  <form class="gate-card" id="gateForm">
    <span class="logo">
      <svg viewBox="0 0 120 80" aria-hidden="true"><circle cx="38" cy="46" r="24"/><circle cx="66" cy="32" r="30"/><circle cx="94" cy="50" r="20"/><rect x="14" y="46" width="100" height="28" rx="14"/></svg>
      <span>구름닷컴</span>
    </span>
    <h1 id="gateTitle">우리 반 친구만 들어올 수 있어요</h1>
    <p>선생님이나 반장에게 받은 초대코드를 입력해 주세요.</p>
    <div class="field">
      <label for="gateCode">초대코드</label>
      <input id="gateCode" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="숫자 4자리">
    </div>
    <p class="err" id="gateErr" role="alert"></p>
    <button class="btn primary" type="submit">입장하기</button>
    <span class="hint">한 번 들어오면 이 기기에서는 다시 묻지 않아요.</span>
  </form>
</section>

<div class="sky">
  <svg class="puff p1" viewBox="0 0 120 56" aria-hidden="true"><circle cx="34" cy="34" r="20"/><circle cx="62" cy="24" r="24"/><circle cx="90" cy="36" r="18"/><rect x="14" y="34" width="94" height="22" rx="11"/></svg>
  <svg class="puff p2" viewBox="0 0 120 56" aria-hidden="true"><circle cx="34" cy="34" r="20"/><circle cx="62" cy="24" r="24"/><circle cx="90" cy="36" r="18"/><rect x="14" y="34" width="94" height="22" rx="11"/></svg>
  <svg class="puff p3" viewBox="0 0 120 56" aria-hidden="true"><circle cx="34" cy="34" r="20"/><circle cx="62" cy="24" r="24"/><circle cx="90" cy="36" r="18"/><rect x="14" y="34" width="94" height="22" rx="11"/></svg>
  <div class="wrap">
    <header class="top">
      <a class="logo" href="#" data-go="list" aria-label="구름닷컴 처음으로">
        <svg viewBox="0 0 120 80" aria-hidden="true"><circle cx="38" cy="46" r="24"/><circle cx="66" cy="32" r="30"/><circle cx="94" cy="50" r="20"/><rect x="14" y="46" width="100" height="28" rx="14"/></svg>
        <span>구름닷컴</span>
      </a>
      <div class="top-right">
        <span class="mode" id="mode">불러오는 중</span>
        <button class="chip-btn" id="nickBtn" type="button">닉네임 정하기</button>
      </div>
    </header>
    <div class="class-head">
      <p class="eyebrow">우리 반 게시판</p>
      <h1 id="className">우리 반</h1>
      <p class="motto" id="classMotto"></p>
    </div>
  </div>
</div>

<div class="wrap layout">
  <main id="main"><div class="loading">게시판을 불러오는 중이에요…</div></main>
  <aside id="side"></aside>
</div>

<div class="modal" id="nickModal" hidden>
  <form id="nickForm">
    <h2>닉네임 정하기</h2>
    <div class="field">
      <label for="nickInput">게시판에서 쓸 이름</label>
      <input id="nickInput" maxlength="12" autocomplete="off" placeholder="예: 3번 김구름">
      <span class="hint">글과 댓글에 이 이름이 보여요. 이 기기에 기억돼요.</span>
    </div>
    <div class="write-actions">
      <button class="btn" type="button" id="nickCancel">취소</button>
      <button class="btn primary" type="submit">저장</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
